<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pusula">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF1F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1316" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Pusula</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: tek sütunlu telefon uygulaması (520px'te ortalı), altta sabit sekme çubuğu; gün çizgisi ve odak halkası sayfanın imzası */
:root{
  --bg:#EDF1F2; --surface:#FFFFFF; --sunken:#E2E8EA; --ink:#12222A; --muted:#566A72; --line:#D3DCDF;
  --accent:#0E6B78; --accent-ink:#FFFFFF; --accent-soft:#D3E9EC;
  --amber:#B86A10; --amber-soft:#F6E5CF; --tomato:#C8442F; --tomato-soft:#F7DDD7;
  --good:#2B7A4B; --bad:#B03636;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree",-apple-system,"Segoe UI",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1316; --surface:#142026; --sunken:#1B2A31; --ink:#E4EDF0; --muted:#94A9B1; --line:#25363E;
  --accent:#4CC0CC; --accent-ink:#06262B; --accent-soft:#163A40;
  --amber:#EFA54A; --amber-soft:#3A2A16; --tomato:#F07F69; --tomato-soft:#3D1F1A;
  --good:#5FCB8A; --bad:#F07A7A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C1316; --surface:#142026; --sunken:#1B2A31; --ink:#E4EDF0; --muted:#94A9B1; --line:#25363E;
  --accent:#4CC0CC; --accent-ink:#06262B; --accent-soft:#163A40;
  --amber:#EFA54A; --amber-soft:#3A2A16; --tomato:#F07F69; --tomato-soft:#3D1F1A;
  --good:#5FCB8A; --bad:#F07A7A; color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.1}
h2{font-size:19px}
h3{font-size:15px;font-family:var(--body);font-weight:600}
p{margin:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.num{font-variant-numeric:tabular-nums}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:600;font-size:15px;background:var(--sunken);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.tomato{background:var(--tomato);color:#fff}
.btn.ghost{background:transparent;color:var(--accent);padding:0 8px}
.btn.danger{color:var(--bad)}
.btn.big{min-height:56px;font-size:17px;padding:0 28px;border-radius:16px}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:18px;height:18px;flex:none}

input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:10px 12px;width:100%}
textarea{resize:vertical;line-height:1.5}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=time]{min-width:104px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}

/* başlık */
.top{display:flex;align-items:flex-start;gap:12px;padding-block:6px 2px}
.top .grow{display:flex;flex-direction:column;gap:4px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:800;font-size:18px;display:grid;place-items:center;flex:none}
.why{font-size:14px;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}
.datebar{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.datebar .lbl{flex:1;text-align:center;font-weight:600;min-width:0}
.iconbtn{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn svg{width:20px;height:20px}

/* gün çizgisi */
.tl{display:flex;flex-direction:column;gap:8px}
.tl-track{position:relative;height:30px;border-radius:10px;background:var(--sunken);overflow:hidden}
.tl-past{position:absolute;inset:0 auto 0 0;background:var(--accent-soft)}
.tl-peak{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--amber) 28%,transparent) 5px 7px);border-left:2px solid var(--amber);border-right:2px solid var(--amber)}
.tl-dip{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--muted) 14%,transparent)}
.tl-dot{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--ink)}
.tl-dot.done{background:var(--good)}
.tl-now{position:absolute;top:-2px;bottom:-2px;width:3px;margin-left:-1.5px;background:var(--tomato);border-radius:2px}
.tl-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.key{display:inline-flex;align-items:center;gap:6px}
.key i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* segment / çip */
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{min-height:44px;border-radius:10px;background:var(--sunken);font-weight:700;font-family:var(--display);font-size:18px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:disabled{opacity:.5}

/* kartlar */
.next{background:var(--accent);color:var(--accent-ink);border:0}
.next .eyebrow{color:inherit;opacity:.8}
.next .when{font-family:var(--display);font-size:34px;line-height:1;font-weight:800}
.next .what{font-size:18px;font-weight:600}
.on-accent{background:var(--accent-ink);color:var(--accent)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.stat .big{font-family:var(--display);font-size:26px;line-height:1;font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .3s}
.bar.amber>i{background:var(--amber)}
.bar.tomato>i{background:var(--tomato)}
.bar.over>i{background:var(--bad)}
.water{display:flex;gap:6px;flex-wrap:wrap}
.drop{width:30px;height:38px;border-radius:8px 8px 14px 14px;border:2px solid var(--accent);opacity:.45}
.drop.on{background:var(--accent);opacity:1}
.evening{background:var(--sunken);border-color:transparent}

/* koç */
.coach-out{font-size:15px;display:flex;flex-direction:column;gap:8px}
.coach-out ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.coach-out:empty{display:none}
.thinking{color:var(--muted);font-style:italic}

/* listeler */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{width:48px;flex:none;color:var(--muted);font-size:14px}
.item .title{flex:1;min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:2px}
.item .sub{font-size:12px;color:var(--muted)}
.item.done .title>span:first-child{text-decoration:line-through;color:var(--muted)}
.check{width:28px;height:28px;flex:none;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center}
.check svg{width:16px;height:16px;opacity:0}
.done .check{background:var(--good);border-color:var(--good);color:#fff}
.done .check svg{opacity:1}
.del,.play{color:var(--muted);width:36px;height:36px;display:grid;place-items:center;border-radius:8px;flex:none}
.play{color:var(--tomato)}
.del svg,.play svg{width:18px;height:18px}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--amber);background:var(--amber-soft);border-radius:6px;padding:1px 6px;align-self:flex-start}
.toms{font-size:12px;color:var(--tomato);font-weight:600}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.sugg{border:1px dashed var(--accent);background:var(--accent-soft)}
.streak{font-size:13px;font-weight:700;color:var(--amber);flex:none}

/* odak */
.timer{align-items:center;text-align:center;gap:16px}
.ring{width:min(78vw,280px);height:auto;display:block}
.ring text{font-family:var(--display)}
.phase-focus{--ph:var(--tomato)}
.phase-break{--ph:var(--good)}
.phase-idle{--ph:var(--accent)}
.toms-row{display:flex;gap:6px;justify-content:center}
.toms-row i{width:12px;height:12px;border-radius:50%;border:2px solid var(--tomato)}
.toms-row i.on{background:var(--tomato)}
.mini{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:21;background:var(--ink);color:var(--bg);border-radius:99px;padding:8px 16px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}
.mini b{font-variant-numeric:tabular-nums}
.mini .dot{width:8px;height:8px;border-radius:50%;background:var(--tomato)}
.mini.brk .dot{background:var(--good)}

/* kalori + grafik */
.kcal-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.kcal-head .big{font-family:var(--display);font-size:40px;line-height:1;color:var(--amber);font-weight:800}
.meal-group h3{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em;padding-top:4px}
.kcal{color:var(--amber);font-weight:600;font-size:14px;flex:none}
.chart svg{width:100%;height:auto;display:block}
.wk{overflow-x:auto}
.wk table{border-collapse:separate;border-spacing:4px;width:100%;font-size:13px}
.wk th{font-weight:600;color:var(--muted);text-align:left;white-space:nowrap}
.wk td{text-align:center;border-radius:8px;height:34px;min-width:34px;font-variant-numeric:tabular-nums;font-weight:600}

/* notlar */
.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:110px;min-width:0}
.note .nt{font-weight:700;overflow-wrap:anywhere}
.note .nb{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;white-space:pre-line}
.note .nd{font-size:11px;color:var(--muted);margin-top:auto}
.note.pinned{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}

.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
.sheet .ttl{font-family:var(--display);font-size:24px;font-weight:700;border:0;background:transparent;padding:4px 0}
.sheet textarea.body{flex:1;min-height:240px;border:0;background:transparent;padding:4px 0;resize:none}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.ob h1{font-size:28px}
.calc{font-family:var(--display);font-size:28px;font-weight:800;color:var(--amber)}

/* sekmeler */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);border-radius:10px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}

.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
.banner{font-size:13px;color:var(--muted);background:var(--sunken);border-radius:12px;padding:10px 12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app" id="view" aria-live="polite"><p class="muted">Pusula hazırlanıyor…</p></div>
<button class="mini" id="mini" data-go="odak" hidden></button>
<nav class="tabs" aria-label="Bölümler"><div class="tabs-in" id="tabs"></div></nav>
<div id="sheet-root"></div>
<div id="ob-root"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
// ================= yardımcılar =================
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const todayKey = () => keyOf(new Date());
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const nowHM = () => hm(new Date());
const toMin = t => { const [h, m] = (t || '0:0').split(':').map(Number); return h * 60 + m; };
const fmtLong = k => fromKey(k).toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtShortDay = k => fromKey(k).toLocaleDateString('tr-TR', { weekday: 'short' });
const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mmss = ms => { const s = Math.max(0, Math.round(ms / 1000)); return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`; };

const ICON = {
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  odak: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M9.5 3h5M12 3v3"/></svg>',
  plan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17M8 14h3M8 17h6"/></svg>',
  kalori: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.5c.6 3.2 5 5.4 5 10.2a5 5 0 0 1-10 0c0-2.4 1.2-3.8 2.4-4.8.1 2 1 3.2 2.2 3.4-.5-3.2-.4-5.9.4-8.8z"/></svg>',
  notes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M15 3v4h4M8.5 12h7M8.5 15.5h7"/></svg>',
  left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9zM19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.2-6.5a1 1 0 0 0 0-1.7L9.5 4.6A1 1 0 0 0 8 5.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>',
};

// ================= kişiselleştirme sabitleri =================
const TABS = [['today', 'Bugün'], ['odak', 'Odak'], ['plan', 'Plan'], ['kalori', 'Beslenme'], ['notes', 'Notlar']];
const MEALS = ['Kahvaltı', 'Öğle', 'Akşam', 'Ara öğün'];
const TONES = {
  nazik: ['Nazik ve destekleyici', 'sıcak, cesaretlendirici ve nazik'],
  disiplinli: ['Disiplinli, beni zorlasın', 'disiplinli, net ve hafif zorlayıcı bir antrenör gibi'],
  kisa: ['Kısa ve net', 'çok kısa ve doğrudan, gereksiz söz yok'],
};
const CHRONO = {
  sabah: { l: 'Sabahçıyım', peak: ['08:00', '11:00'], dip: ['13:30', '15:00'], hint: 'Zor işleri sabaha koy.' },
  ara: { l: 'Arada bir yerdeyim', peak: ['10:00', '13:00'], dip: ['14:00', '15:30'], hint: 'Zor işleri öğleden önceye koy.' },
  aksam: { l: 'Akşamcıyım', peak: ['16:00', '20:00'], dip: ['13:00', '15:00'], hint: 'Sabahları hafif işler, zor işler öğleden sonra.' },
};

const writers = new Map();
function persist(key, ref, data) {
  let w = writers.get(key);
  if (!w) { w = { busy: false, next: null }; writers.set(key, w); }
  w.next = { ref, data };
  if (w.busy) return;
  w.busy = true;
  (async () => {
    while (w.next) { const job = w.next; w.next = null; try { await job.ref.set(job.data); } catch (e) { writeErr(e); } }
    w.busy = false;
  })();
}

const MODELS = { 'claude-sonnet-5-5': 'Sonnet 5.5 (önerilen)', 'claude-opus-5-5': 'Opus 5.5 (en akıllı, daha pahalı)', 'claude-haiku-5-5': 'Haiku 5.5 (en hızlı, en ucuz)' };
function apiSampler() {
  const fn = async (input, opts = {}) => {
    const key = LS.get('apikey', '');
    if (!key) throw { code: 'no_key' };
    const messages = typeof input === 'string' ? [{ role: 'user', content: input }] : input;
    const model = opts.modelTier === 'quick' ? 'claude-haiku-5-5' : LS.get('model', 'claude-sonnet-5-5');
    let res, text = '';
    try {
      res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST', signal: opts.signal,
        headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
        body: JSON.stringify({ model, max_tokens: 2000, stream: true, messages }),
      });
    } catch (e) { throw { code: e?.name === 'AbortError' ? 'cancelled' : 'offline' }; }
    if (!res.ok) throw { code: res.status === 401 || res.status === 403 ? 'bad_key' : res.status === 429 ? 'rate_limited' : res.status === 402 || res.status === 400 ? 'billing' : 'upstream_error' };
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    try {
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
          if (!line.startsWith('data:')) continue;
          let ev; try { ev = JSON.parse(line.slice(5)); } catch { continue; }
          if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') { text += ev.delta.text; try { opts.onText?.({ text, delta: ev.delta.text }); } catch {} }
          else if (ev.type === 'error') throw { code: 'upstream_error', text };
        }
      }
    } catch (e) { if (e?.name === 'AbortError') throw { code: 'cancelled', text }; throw e?.code ? e : { code: 'upstream_error', text }; }
    if (!text.trim()) throw { code: 'empty_completion' };
    return { text, truncated: false };
  };
  fn.json = async (input, opts = {}) => {
    const { text } = await fn(input + '\n\nYalnızca geçerli JSON döndür, başka hiçbir metin yazma.', opts);
    const tries = [text, (text.match(/```(?:json)?\s*([\s\S]*?)```/) || [])[1], (() => { const a = text.search(/[\[{]/), b = Math.max(text.lastIndexOf(']'), text.lastIndexOf('}')); return a >= 0 && b > a ? text.slice(a, b + 1) : null; })()];
    for (const t of tries) { if (!t) continue; try { return JSON.parse(t); } catch {} }
    throw { code: 'invalid_json', text };
  };
  return fn;
}
const sampler = () => Promise.resolve(LS.get('apikey', '') ? apiSampler() : null);

function aiErr(e) {

  if (c === 'cancelled') return '';

  if (c === 'billing') return 'API hesabında bakiye yok ya da istek reddedildi. console.anthropic.com’dan kontrol et.';
  if (c === 'offline') return 'İnternet bağlantısı yok. Koç çevrimdışı çalışmaz.';
  if (c === 'rate_limited') return 'Şu an çok fazla istek var. Biraz sonra tekrar dene.';
  if (c === 'session_expired') return 'Oturumun sona ermiş. Yeniden giriş yap.';
  if (c === 'invalid_json') return 'Yanıt anlaşılamadı. Tekrar dene.';

  return 'Koça ulaşılamadı. Tekrar dene.';
}

let actx = null, wakeLock = null;

  if (!actx) return;
  try {
    const t = actx.currentTime, notes = kind === 'focus' ? [660, 880, 990] : [990, 880, 660];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), at = t + i * 0.22;

}

function timerView() {

  const left = T.paused ? T.left : T.endAt - now, total = T.endAt - T.startAt + (T.paused ? 0 : 0);

}

function weekChart(goal) {
  const keys = weekKeys(S.date), v = Object.fromEntries(keys.map(k => [k, histFor(k)?.k || 0]));
  const max = Math.max(goal * 1.25, ...keys.map(k => v[k]));
  const W = 320, H = 160, top = 14, base = 128, bw = 28, gap = (W - 16 - bw * 7) / 6;
  const y = val => base - (val / max) * (base - top);
  const bars = keys.map((k, i) => {
    const x = 8 + i * (bw + gap), val = v[k], h = base - y(val), cur = k === S.date;
    return `<rect x="${x}" y="${y(val)}" width="${bw}" height="${Math.max(h, val ? 2 : 0)}" rx="6" fill="${val > goal ? 'var(--bad)' : 'var(--amber)'}" opacity="${cur ? 1 : .55}"/>
      ${val ? `<text x="${x + bw / 2}" y="${y(val) - 4}" text-anchor="middle" font-size="9" fill="var(--muted)">${val}</text>` : ''}
      <text x="${x + bw / 2}" y="${base + 16}" text-anchor="middle" font-size="11" fill="${cur ? 'var(--ink)' : 'var(--muted)'}" font-weight="${cur ? 700 : 500}">${esc(fmtShortDay(k))}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Son 7 günün kalorisi, hedef ${goal}">
    <line x1="4" x2="${W - 4}" y1="${base}" y2="${base}" stroke="var(--line)"/>
    <line x1="4" x2="${W - 4}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--accent)" stroke-dasharray="4 4"/>
    <text x="${W - 4}" y="${y(goal) - 4}" text-anchor="end" font-size="9" fill="var(--accent)">hedef ${goal}</text>${bars}</svg>`;
}

function weekTable() {

  return `<div class="wk"><table><thead><tr><th></th>${keys.map(k => `<th style="text-align:center">${esc(fmtShortDay(k))}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(([l, f, max]) => `<tr><th>${l}</th>${keys.map(k => { const h = histFor(k); return f === 'td' ? `<td style="background:var(--sunken)">${h && h.tt ? `${h.td}/${h.tt}` : '·'}</td>` : cell(h?.[f] || 0, max); }).join('')}</tr>`).join('')}
  </tbody></table></div>`;
}

function finishOnboarding() {

function backup() {
  const data = {};
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('pusula:') && k !== 'pusula:apikey') data[k] = localStorage.getItem(k); } } catch {}
  const blob = new Blob([JSON.stringify({ app: 'pusula', at: new Date().toISOString(), data })], { type: 'application/json' });
  const name = `pusula-yedek-${todayKey()}.json`;
  const file = new File([blob], name, { type: 'application/json' });
  if (navigator.canShare?.({ files: [file] })) { navigator.share({ files: [file], title: 'Pusula yedeği' }).catch(() => {}); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
document.addEventListener('change', async e => {
  if (e.target.id !== 'restore-file' || !e.target.files[0]) return;
  try {
    const j = JSON.parse(await e.target.files[0].text());
    if (j.app !== 'pusula' || !j.data) throw 0;
    for (const k in j.data) if (k.startsWith('pusula:')) localStorage.setItem(k, j.data[k]);
    toast('Yedek yüklendi.'); setTimeout(() => location.reload(), 800);
  } catch { toast('Bu dosya bir Pusula yedeği değil.'); }
});

  render();
  setInterval(tick, 1000);
  setInterval(() => { if (S.tab === 'today' && !document.activeElement?.matches('input,textarea')) render(); }, 60000);
})();
})();
</script>
